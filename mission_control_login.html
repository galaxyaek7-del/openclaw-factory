<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenClaw Mission Control — دخول</title>
<meta name="theme-color" content="#0f172a">
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #38bdf8; --error: #f87171; --border: #334155;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 2rem; width: 100%; max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  p.sub { color: var(--muted); margin: 0 0 1.5rem; font-size: .9rem; }
  input {
    width: 100%; padding: .75rem 1rem; border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--text); font-size: 1rem; margin-bottom: 1rem;
  }
  button {
    width: 100%; padding: .75rem 1rem; border-radius: 10px; border: none;
    background: var(--accent); color: #0f172a; font-weight: 600; font-size: 1rem; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .error { color: var(--error); font-size: .85rem; margin-top: .75rem; min-height: 1.2em; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>🛰️ OpenClaw Mission Control</h1>
    <p class="sub">مركز التحكم التشغيلي — أدخل كلمة المرور للمتابعة</p>
    <input type="password" id="password" placeholder="كلمة المرور" autofocus required>
    <button type="submit" id="submitBtn">دخول</button>
    <div class="error" id="errorMsg"></div>
  </form>
<script>
  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = '';
    submitBtn.disabled = true;
    try {
      const res = await fetch('/api/mission-control/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('password').value }),
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = '/mission_control.html';
      } else {
        errorMsg.textContent = data.error || 'فشل الدخول';
      }
    } catch (err) {
      errorMsg.textContent = 'تعذّر الاتصال بالخادم';
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
