<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy Forge — Executive Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c11; --bg-elev:#12151d; --bg-card:#161a24; --bg-hover:#1c212e;
  --border:#242938; --border-soft:#1a1e2a;
  --ink:#e9ebf2; --ink-dim:#9198ad; --ink-faint:#5c6379;
  --accent:#d97a3f; --accent-soft:#3a2818; --accent-ink:#f0a468;
  --cool:#5b7fd9; --cool-soft:#182238;
  --good:#4a9d6f; --good-soft:#132a1e;
  --warn:#d9a441; --warn-soft:#2e2412;
  --bad:#c9524f; --bad-soft:#2e1615;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --sans: 'IBM Plex Sans', -apple-system, sans-serif;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -8px rgba(0,0,0,.5);
  --radius: 10px;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased;}
body{display:flex; min-height:100vh;}
a{color:var(--cool);}
::selection{background:var(--accent-soft); color:var(--accent-ink);}

/* ── Sidebar ── */
#sidebar{
  width:260px; flex-shrink:0; background:var(--bg-elev); border-right:1px solid var(--border-soft);
  position:fixed; top:0; bottom:0; left:0; overflow-y:auto; padding:1.1rem .9rem; z-index:20;
  display:flex; flex-direction:column; gap:1rem;
}
.brand{display:flex; align-items:center; gap:.6rem; padding:.3rem .2rem .8rem; border-bottom:1px solid var(--border-soft);}
.brand-mark{width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg, var(--accent), #8a4a1f); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:.9rem; font-weight:700; color:#1a0e05;}
.brand-name{font-weight:700; font-size:.95rem; letter-spacing:-.01em;}
.brand-sub{font-size:.68rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; margin-top:.1rem;}

#searchWrap{position:relative;}
#globalSearch{
  width:100%; background:var(--bg-card); border:1px solid var(--border); color:var(--ink);
  border-radius:8px; padding:.55rem .7rem .55rem 2rem; font-size:.82rem; font-family:var(--sans);
}
#searchWrap::before{content:"⌕"; position:absolute; left:.6rem; top:50%; transform:translateY(-50%); color:var(--ink-faint); font-size:.95rem;}
#globalSearch:focus{outline:none; border-color:var(--accent);}

.sidebar-actions{display:flex; gap:.4rem;}
.sidebar-actions button{flex:1;}

nav#sectionNav{display:flex; flex-direction:column; gap:.1rem; flex:1; overflow-y:auto;}
nav#sectionNav a{
  display:flex; align-items:center; justify-content:space-between; gap:.5rem;
  color:var(--ink-dim); text-decoration:none; font-size:.82rem; padding:.5rem .6rem; border-radius:7px;
}
nav#sectionNav a:hover{background:var(--bg-hover); color:var(--ink);}
nav#sectionNav a.active{background:var(--accent-soft); color:var(--accent-ink);}
nav#sectionNav a .navdot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}
.navdot.ok{background:var(--good);} .navdot.warn{background:var(--warn);} .navdot.bad{background:var(--ink-faint);} .navdot.pending{background:var(--ink-faint); opacity:.4;}

.sidebar-foot{border-top:1px solid var(--border-soft); padding-top:.8rem; font-size:.7rem; color:var(--ink-faint); line-height:1.5;}

button.btn{
  font-family:var(--sans); font-size:.78rem; font-weight:600; padding:.5rem .7rem; border-radius:7px;
  border:1px solid var(--border); background:var(--bg-card); color:var(--ink); cursor:pointer;
}
button.btn:hover{background:var(--bg-hover); border-color:var(--accent);}
button.btn.primary{background:var(--accent); border-color:var(--accent); color:#1a0e05;}
button.btn.primary:hover{background:var(--accent-ink);}
button.btn:disabled{opacity:.5; cursor:not-allowed;}

/* ── Main ── */
#main{margin-left:260px; flex:1; min-width:0; padding:1.4rem 1.8rem 4rem;}
#topbar{display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.6rem; flex-wrap:wrap;}
#topbar h1{font-size:1.3rem; margin:0; font-weight:700; letter-spacing:-.01em;}
#topbar .meta{font-size:.76rem; color:var(--ink-faint); font-family:var(--mono);}
#topStatus{display:flex; align-items:center; gap:.5rem; font-size:.78rem; color:var(--ink-dim);}
#topStatus .pulse{width:8px; height:8px; border-radius:50%; background:var(--good); box-shadow:0 0 0 3px var(--good-soft);}

section.section{margin-bottom:2.2rem; scroll-margin-top:1rem;}
.section-head{display:flex; flex-direction:column; gap:.15rem; margin-bottom:.7rem;}
.section-head h2{font-size:1rem; margin:0; font-weight:700;}
.section-head .section-note{font-size:.74rem; color:var(--ink-faint); max-width:64ch; line-height:1.4;}

.card-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:.9rem;}
.card{
  background:var(--bg-card); border:1px solid var(--border-soft); border-radius:var(--radius);
  padding:1rem 1.1rem; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:.6rem;
}
.card.filtered-out{display:none;}
.card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:.6rem;}
.card-title{font-size:.88rem; font-weight:600;}
.pill{font-size:.65rem; font-weight:600; padding:.18rem .55rem; border-radius:99px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;}
.pill.ok{background:var(--good-soft); color:var(--good);}
.pill.warn{background:var(--warn-soft); color:var(--warn);}
.pill.bad{background:var(--bad-soft); color:var(--bad);}
.pill.pending{background:var(--bg-elev); color:var(--ink-faint);}

.card-meta{display:flex; flex-wrap:wrap; gap:.5rem 1rem; font-size:.68rem; color:var(--ink-faint); font-family:var(--mono);}
.card-meta span b{color:var(--ink-dim); font-weight:500;}

.card-body{font-size:.82rem; color:var(--ink-dim); line-height:1.6;}
.card-body .empty{color:var(--ink-faint); font-style:italic;}
.kv-grid{display:grid; grid-template-columns:minmax(100px,1fr) minmax(0,2.1fr); gap:.35rem 1rem; font-size:.8rem; align-items:baseline;}
.kv-grid .k{color:var(--ink-faint); cursor:default;}
.kv-grid .v{color:var(--ink); font-family:var(--mono); text-align:right; font-variant-numeric:tabular-nums; word-break:break-word;}
.kv-grid .v.text{text-align:left; font-family:var(--sans);}
.stat-row{display:flex; gap:1.1rem; flex-wrap:wrap;}
.stat{display:flex; flex-direction:column; gap:.1rem;}
.stat .num{font-family:var(--mono); font-size:1.35rem; font-weight:600; color:var(--ink);}
.stat .label{font-size:.68rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em;}
ul.card-list{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:.4rem; max-height:260px; overflow-y:auto;}
ul.card-list li{border-bottom:1px solid var(--border-soft); padding-bottom:.4rem; font-size:.79rem;}
ul.card-list li:last-child{border-bottom:none; padding-bottom:0;}
table.card-table{width:100%; border-collapse:collapse; font-size:.78rem;}
table.card-table th{text-align:left; color:var(--ink-faint); font-weight:500; font-size:.68rem; text-transform:uppercase; letter-spacing:.03em; padding:.2rem .4rem .4rem 0;}
table.card-table td{padding:.3rem .4rem .3rem 0; border-top:1px solid var(--border-soft); font-family:var(--mono); font-variant-numeric:tabular-nums;}
.note-line{font-size:.74rem; color:var(--ink-faint); border-left:2px solid var(--border); padding-left:.6rem; margin-top:.2rem;}
pre.raw{
  background:var(--bg-elev); border-radius:6px; padding:.6rem .7rem; font-size:.72rem; margin:.3rem 0 0;
  color:var(--ink-dim); max-height:280px; overflow-y:auto; overflow-x:auto;
  white-space:pre-wrap; word-break:break-word; font-family:var(--mono);
}
.card-body details{border:1px solid var(--border-soft); border-radius:8px; padding:.5rem .7rem; background:var(--bg-elev);}
.card-body details[open]{padding-bottom:.7rem;}
.card-body details summary{list-style:none;}
.card-body details summary::-webkit-details-marker{display:none;}
.card-body details summary::before{content:"▸ "; color:var(--ink-faint);}
.card-body details[open] summary::before{content:"▾ "; color:var(--accent-ink);}
.card-body details + details{margin-top:.5rem;}

@media (max-width: 880px){
  #sidebar{position:fixed; transform:translateX(-100%); transition:transform .2s; width:82%; max-width:300px;}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0; padding:1rem 1rem 3rem;}
  #menuToggle{display:inline-flex !important;}
}
#menuToggle{display:none; align-items:center; justify-content:center;}

@media print{
  #sidebar, #topbar, .sidebar-actions{display:none !important;}
  #main{margin-left:0;}
  body{background:#fff; color:#000;}
  .card{break-inside:avoid; border:1px solid #ccc; box-shadow:none;}
}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <div class="brand-mark">GF</div>
    <div>
      <div class="brand-name">Galaxy Forge</div>
      <div class="brand-sub">Executive Mission Control</div>
    </div>
  </div>
  <div id="searchWrap">
    <input id="globalSearch" type="search" placeholder="Search everything…">
  </div>
  <div class="sidebar-actions">
    <button class="btn" id="refreshBtn" title="Re-fetch every real source">↻ Refresh</button>
    <button class="btn" id="exportBtn" title="Download the currently loaded real data as JSON">⇩ Export</button>
  </div>
  <button class="btn primary" id="pdfBtn" style="width:100%;">📄 Executive PDF Report</button>
  <nav id="sectionNav"></nav>
  <div class="sidebar-foot">
    Every value below comes from a real endpoint or existing module — never fabricated.
    Unavailable data reads "No verified data," not a guess.
  </div>
</aside>

<button id="menuToggle" class="btn" style="position:fixed; top:.8rem; left:.8rem; z-index:30;">☰</button>

<main id="main">
  <div id="topbar">
    <div>
      <h1>Executive Mission Control</h1>
      <div class="meta" id="lastRefreshLine">not yet loaded</div>
    </div>
    <div id="topStatus"><span class="pulse"></span><span id="topStatusText">Loading real data…</span></div>
  </div>
  <div id="sections"></div>
</main>

<script>
(function(){
  "use strict";

  // ── Section registry: each maps 1:1 to a real, already-existing v1 service. ──
  // No new engines — every "service" below is a real function this factory
  // already had (widened onto /api/v1/*), or one of the 4 new, explicitly
  // thin, read-only aggregations built alongside this dashboard (evidence-
  // engine-status, scheduler-status, recent-adr-decisions, system-logs —
  // each a plain read over an existing real file/log, not a new engine).
  const SECTIONS = [
    { id:'company-health', title:'Company Health', service:'company-health', kind:'kv',
      note:'Live infra + business-reality health checks (lib/health_checks.js + reality.py).' },
    { id:'executive-summary', title:'Executive Summary', service:'get-ceo-dashboard', via:'action', kind:'kv',
      note:'The real CEO dashboard snapshot — capital allocation, growth, risk, next decision.' },
    { id:'opportunity-pipeline', title:'Opportunity Pipeline', service:'opportunity-pipeline', kind:'list', listKey:'product_laboratory',
      note:'Every real decision the ladder has evaluated, ranked.' },
    { id:'investment-pipeline', title:'Investment Pipeline', service:'get-investment-pipeline', via:'action', kind:'list', listKey:'entries',
      note:'All real decisions scored across every ranking dimension.' },
    { id:'commercial-intelligence', title:'Commercial Intelligence', service:'market-intelligence', kind:'kv',
      note:'The single most recent real niche market-intelligence analysis (a snapshot, not a trend).' },
    { id:'product-portfolio', title:'Product Portfolio', service:'get-portfolio-report', via:'action', kind:'kv',
      note:'Real accepted opportunities, ranked 4 ways: worldwide, enterprise, recurring-revenue, China.' },
    { id:'production-status', title:'Production Status', service:'production-queue', kind:'kv',
      note:'Real dossiers generated by the production pipeline.' },
    { id:'distribution-status', title:'Distribution Status', service:'publishing-status', kind:'kv',
      note:'Real per-platform publishing checklist status.' },
    { id:'revenue-status', title:'Revenue Status', service:'revenue-summary', kind:'kv',
      note:'Real revenue_pipeline results for every ACCEPTED opportunity.' },
    { id:'evidence-engine', title:'Evidence Engine', service:'evidence-engine-status', kind:'kv',
      note:'The Market Evidence Ledger — real payment/pain citations per niche (ADR-121/122).' },
    { id:'market-memory', title:'Market Memory', service:'get-monthly-market-evolution-report', via:'action', kind:'kv',
      note:'Monthly niche-scoring trend across time (distinct from the single-snapshot Commercial Intelligence above) — honestly reports DISCOVERY until enough months of history exist.' },
    { id:'knowledge-graph', title:'Knowledge Graph', service:'knowledge-graph', kind:'kv',
      note:'Every real niche/decision/production node this factory has ever recorded, as a graph.' },
    { id:'ai-agents-status', title:'AI Agents Status', service:'ai-capability-registry', kind:'kv',
      note:'Which AI providers are actually configured and callable today.' },
    { id:'automation-status', title:'Automation Status (n8n)', service:'automation-status', kind:'kv',
      note:'Real n8n workflow files on disk; live status needs a one-time manual n8n login (BLOCKERS.md #1).' },
    { id:'scheduler', title:'Scheduler', service:'scheduler-status', kind:'kv',
      note:'The one real, durable OS-level scheduled task this factory has.' },
    { id:'alerts', title:'Alerts', service:'alerts', kind:'kv',
      note:'Two real flags: does anything need founder attention or review right now.' },
    { id:'recent-adrs', title:'Recent ADR Decisions', service:'recent-adr-decisions', kind:'list', listKey:'recent',
      note:'Every governance decision this factory has actually made, newest first.' },
    { id:'system-diagnostics', title:'Live Logs & System Diagnostics', service:'system-logs', kind:'logs',
      note:'Real tail of the 5 operational log files this factory writes.' },
    { id:'evidence-coverage', title:'Evidence Coverage & Research Queue', service:'evidence-coverage-status', kind:'kv',
      note:'ADR-128: real evidence coverage/unknown-count/research-queue/top-missing-signals across every decision that carries evidence tracking, plus real freshness of the 2 real evidence caches.' },
    { id:'evidence-network', title:'Evidence Network', service:'evidence-network-status', kind:'kv',
      note:'ADR-128: which evidence sources are actually real and callable today vs. declared-but-not-built — the competitive advantage is owning this network, not a better score.' },
    { id:'customer-pipeline', title:'Customer Pipeline', service:'customer-pipeline-status', kind:'kv',
      note:'ADR-130: real per-request Status/Progress/Logs/Failures/Recovery for every real customer request — stage distribution, and which ones need a real founder action right now (Paddle onboarding gate, a missing custom product, or a real failure). Trigger new evaluations via POST /api/v1/actions/advance-customer-pipeline.' },
    { id:'customer-accounts', title:'Customer Accounts', service:'customer-accounts', kind:'kv',
      note:'Round 6 (2026-07-29): real signed-up customer accounts — count + most recently created, never a password hash.' },
    { id:'customer-fulfillment-queue', title:'Production & Fulfillment Queue', service:'customer-fulfillment-queue', kind:'kv',
      note:'Round 6: every real request that reached PAID or later — the real founder-action queue (PENDING_FOUNDER_FULFILLMENT, no automated production trigger exists for this product) is surfaced separately. Attach a real deliverable via POST /api/v1/actions/fulfill-customer-request-manually.' },
    { id:'customer-invoices', title:'Invoices', service:'customer-invoices', kind:'kv',
      note:'Round 6: real invoices generated only from actual completed Paddle payments — honestly empty until a real payment completes. Check for new completions via POST /api/v1/actions/check-customer-payments.' },
    { id:'customer-reviews', title:'Customer Reviews', service:'customer-reviews', kind:'kv',
      note:'Round 5/6: real customer reviews, one per delivered order — honestly empty until a real review exists, never a placeholder testimonial.' },
    { id:'support-tickets', title:'Support Tickets', service:'support-tickets', kind:'kv',
      note:'Executive Intelligence Core, Round 3 (2026-07-29): real support ticket count/open-count/recent — data/support_tickets.jsonl was write-only until now, honestly empty today (zero real customer traffic yet).' },
    { id:'executive-score', title:'Executive Score', service:'executive-score', kind:'kv',
      note:'Executive Intelligence Core, Round 6 (2026-07-29): a transparent, real-component composite (Trust/Production Quality/Technical Debt/Security Health/Delivery Quality/Automation/Growth/Architecture Health/Operational Stability/Customer Happiness). Every sub-score is real or an honest "Unknown" — never blended into any accept/reject/production gate.' },
    { id:'resilience-status', title:'Resilience Monitor', service:'resilience-status', kind:'kv',
      note:'Continuous Trust & Resilience Monitoring (2026-07-29): every monitored area classified informational/warning/critical/emergency in one place, plus a transparent resilience_score. Reuses every existing signal — never a second detector. Respond stays exactly as founder-gated as before: use publish-emergency-stop / mark-subsystem-unstable / approve-* actions elsewhere on this page to act on an alert here.' },
    { id:'resilience-incidents', title:'Resilience Incidents (Learn)', service:'resilience-incidents', kind:'kv',
      note:'Every real incident this factory has ever recorded — root cause, prevention rule, detection rule, a live-checked improvement proposal id, and rollback guidance. Honestly empty until a real critical/emergency finding has occurred.' },
    { id:'safe-mode-status', title:'Safe Mode', service:'safe-mode-status', kind:'kv',
      note:'Global Trust & Resilience Layer, Round 2 (2026-07-29): real per-subsystem isolation — an unstable subsystem stops on its own, the rest of the company keeps running, never a cascading halt. Isolate via POST /api/v1/actions/mark-subsystem-unstable ({ name, reason }), restore via .../clear-subsystem-unstable ({ name }). marketplace_publishing is a live passthrough to the Marketplace Publish Protection panel above — halt it via publish-emergency-stop instead.' },
    { id:'publish-protection-status', title:'Marketplace Publish Protection', service:'publish-protection-status', kind:'kv',
      note:'Global Commercial Hardening, Phase 1 (2026-07-29): real per-arm publish counts, active cooldowns, and a real risk_score for every marketplace channel this factory has ever really published to — honestly empty until then. Halt every arm instantly via POST /api/v1/actions/publish-emergency-stop ({ reason }), reverse via .../publish-emergency-resume. Founder Protection (Round 4, 2026-07-29): a genuinely new arm (never Gumroad/Etsy/Payhip/Paddle) is blocked pending .../approve-first-publish ({ arm_name }); any publish crossing the real high-risk threshold is blocked pending .../approve-elevated-risk-publish ({ arm_name }), single-use.' },
    { id:'evolution-queue', title:'Evolution Queue', service:'evolution-queue', kind:'kv',
      note:'Autonomous Company Evolution Engine, Round 6 (2026-07-29): every real proposal, its real simulated impact/rollback-complexity, and its real stage. factory_loop.js\'s daily tick only ever intakes/simulates/decides (stopping at AWAITING_FOUNDER_APPROVAL) — nothing auto-approves or auto-executes, whatever the computed risk tier. Approve via POST /api/v1/actions/approve-evolution-proposal, reject via .../reject-evolution-proposal, close the loop after a real reviewed implementation via .../mark-evolution-proposal-implemented — each requires { proposal_id } in the request body.' },
    { id:'executive-brief', title:'Executive Brief', service:'executive-brief', kind:'kv',
      note:'Strategic Intelligence Core (2026-07-29): company_health, top_risks, top_opportunities, top_bottlenecks, recommended_priorities, products_to_accelerate/pause, research_needed, and founder_decisions_required — every field a citation of an already-real panel above, never a second computation. research_needed honestly lists the real, current NOT ENOUGH EVIDENCE gaps (multi-year horizons, customer-problem cost trend) rather than inventing one. Read-only, recommend-only — nothing here executes autonomously on anything irreversible.' },
    { id:'galaxy-council-learning', title:'Galaxy Council Learning', service:'galaxy-council-learning', kind:'kv',
      note:'Galaxy Council (2026-07-29): the real 3-way join — Council Recommendation vs. the real Founder Decision that followed vs. the real eventual Outcome, the same True/False/None non-forced-verdict discipline as Executive Board\'s review-board-track-record. Honestly NOT ENOUGH EVIDENCE until real triples accumulate — never backfilled for a niche/decision that predates the Council\'s existence. Convene the Council itself, per-niche, from the Opportunities tab in mission_control.html ("🏛️ استدعِ مجلس المجرة").' },
    { id:'capital-allocation-dashboard', title:'Capital Allocation Dashboard', service:'capital-allocation-dashboard', kind:'kv',
      note:'Capital Allocation Engine (2026-07-29): Top ROI Initiatives (real Priority Score ranking, value_engine.build_value_engine_report()), Projects Losing Value (real at_risk-flagged opportunities), Projects Consuming Resources Without Results (real ACCEPTED opportunities with zero real production attempt after 7+ real days), Resource Distribution (real scheduler.py buckets + department attention counts), Expected Portfolio Return (transparent average of only real ROI values), and real opportunity-cost pairings (which real opportunities are effectively delaying which). Sunk-cost protection is structural, by omission — neither this nor any underlying function ever looks at cumulative past spend. Read-only, recommend-only — the Founder remains final authority on every real reallocation. Per-niche Investment Score (14 dimensions) via the "💰 Investment Score" button in mission_control.html\'s Opportunities tab.' },
    { id:'global-opportunity-exchange', title:'Global Opportunity Exchange', service:'global-opportunity-exchange', kind:'kv',
      note:'Global Opportunity Exchange (2026-07-29): Global Opportunity Map, Capital Flow Between Markets, Market Health/Saturation (real per-arm publish state — distinct from niche/product-category saturation, which stays competitor_discovery.py\'s domain), Opportunity Ranking, Revenue Distribution, and the Market Dependency Index (the 4 named concentration checks: >40% one platform, >30% one product family, >25% one country, >20% one AI provider). Honestly DISCOVERY-heavy today — only 4 of the directive\'s 15 named marketplaces (Gumroad, Etsy, plus Payhip/Paddle, which the directive itself never named) have a real registered channel arm, 0 real sale events exist yet, and country dependency is a permanent structural DISCOVERY citing this factory\'s own founder-confirmed 2026-07-23 decision (CLAUDE.md) — never fabricated to look more built-out. Real diversification recommendations only ever cite a check that actually, currently crosses its real threshold. Read-only, recommend-only — the Founder remains final authority on every real reallocation.' },
    { id:'business-pipeline', title:'Business Pipeline', service:'business-pipeline', kind:'kv',
      note:'Autonomous Business Builder (2026-07-29): a thin citation of production_blueprint.py\'s already-real 6-bucket production missions board (READY TO BUILD/BUILDING/QUALITY REVIEW/READY TO SELL/LIVE/LEARNING) — ABB\'s own "Business Pipeline"/"Blueprint Status" ask, no new bucketing logic. Investment Required/Expected Return/Priority/Risk/Confidence, and the full 12-section/8-estimate Business Blueprint, are available per-niche via the "📋 Business Blueprint" button in mission_control.html\'s Opportunities tab.' },
    { id:'execution-phases', title:'Execution Phases', service:'execution-phases', kind:'kv',
      note:'Autonomous Business Builder (2026-07-29): the real, company-wide 5-phase execution roadmap (orchestrator.types.EXECUTION_ORDER: market_intelligence → decision → production → publishing → learning), each phase with real per-stage engine health (executive_intelligence.engine_health.compute_engine_health()) and a real, disclosed deterministic rollback plan (Dual Inspection quarantine, publish-protection emergency stop, etc.) — never a fabricated task list this factory doesn\'t track. required_ai_models is cited once, company-wide (ai_capability.orchestrator.resource_allocation_status()) — no real per-phase AI-provider breakdown exists yet.' },
  ];

  const state = {}; // id -> { status: 'pending'|'ok'|'empty'|'error', payload, fetchedAt }

  function el(tag, attrs, children){
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs){
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c => { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }

  function relTime(iso){
    if (!iso) return '—';
    const d = new Date(iso), s = Math.round((Date.now() - d.getTime())/1000);
    if (s < 5) return 'just now';
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.round(s/60) + 'm ago';
    if (s < 86400) return Math.round(s/3600) + 'h ago';
    return Math.round(s/86400) + 'd ago';
  }

  // ── Honesty classification: real fields already carry the confidence
  // signal wherever this factory already tags one (this Reality Mode-
  // adjacent convention already exists elsewhere in the codebase) — this
  // never invents a confidence percentage, only reads what's really there
  // or falls back to a plain presence/absence check. ──
  // `sec` is required whenever the caller knows which section this payload
  // belongs to: a 'list' section's real envelope (success/generated_at/etc.)
  // is routinely non-empty even when the one array a CEO actually cares
  // about (sec.listKey) is empty or missing -- checking the envelope alone
  // previously produced a real bug (Investment Pipeline showing a "Live"
  // pill while its own body said "No verified data").
  function isMeaningfullyEmpty(payload, sec){
    if (payload == null) return true;
    if (sec && sec.kind === 'list'){
      const items = sec.listKey ? payload[sec.listKey] : payload;
      return !Array.isArray(items) || items.length === 0;
    }
    if (Array.isArray(payload)) return payload.length === 0;
    if (typeof payload === 'object'){
      const keys = Object.keys(payload).filter(k => !['note','generated_at','niche'].includes(k));
      if (keys.length === 0) return true;
      return keys.every(k => {
        const v = payload[k];
        if (v == null) return true;
        if (Array.isArray(v)) return v.length === 0;
        if (typeof v === 'object') return Object.keys(v).length === 0;
        if (typeof v === 'number') return false;
        return v === '' || v === false;
      });
    }
    return false;
  }

  function confidenceFor(payload, sec){
    if (payload && typeof payload === 'object'){
      if (typeof payload.confidence === 'string') return payload.confidence;
      if (payload.confidence && payload.confidence.level) return payload.confidence.level;
      if (typeof payload.maturity === 'string') return payload.maturity;
    }
    return isMeaningfullyEmpty(payload, sec) ? 'No verified data' : 'Verified — real source';
  }

  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  // A handful of real reports (Executive Summary, Investment Pipeline,
  // Product Portfolio, Market Memory) are registered as real, ASYNC
  // actions (POST /api/v1/actions/<name>, {confirmed:true} -> a job id,
  // polled via GET /api/v1/actions/:id until it really finishes) rather
  // than plain GET services — same real underlying report either way,
  // just a different real transport this factory already uses for a
  // Python subprocess call. Never invents a result before the real job
  // actually completes.
  async function fetchActionResult(name, timeoutMs = 25000){
    const start = await fetch('/api/v1/actions/' + name, {
      method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ confirmed:true }),
    });
    const startBody = await start.json();
    if (!start.ok || startBody.success === false){
      throw new Error((startBody.error && startBody.error.message) || startBody.error || ('HTTP ' + start.status));
    }
    const jobId = startBody.job.id;
    const deadline = Date.now() + timeoutMs;
    let job = startBody.job;
    // Backs off from 600ms towards a 3s ceiling instead of a flat 700ms --
    // these real jobs measure 3-25s in practice, so a flat interval means
    // dozens of redundant polls near the end of a long-running report for
    // no real benefit. Still responsive on the fast (~3s) reports.
    let pollDelay = 600;
    while (job.status === 'running' && Date.now() < deadline){
      await sleep(pollDelay);
      pollDelay = Math.min(pollDelay * 1.4, 3000);
      const poll = await fetch('/api/v1/actions/' + jobId, { credentials:'same-origin' });
      const pollBody = await poll.json();
      if (!poll.ok || pollBody.success === false) throw new Error('lost track of job ' + jobId);
      job = pollBody.job;
    }
    if (job.status === 'running') throw new Error('timed out waiting for a real result (' + (timeoutMs/1000) + 's)');
    if (job.status === 'failed') throw new Error(job.error || 'action failed');
    return { data: job.result, finishedAt: job.finished_at };
  }

  // `fresh:true` (the Refresh button, and each auto-refresh tick) appends
  // ?fresh=1 -- server.js's runPythonServiceCached() treats that as an
  // explicit bypass of its own real 20s cache, so "Refresh" always means
  // a genuinely fresh real read, never a stale cached one. Initial page
  // load omits it deliberately: it's fine, even desirable, to reuse a
  // just-populated real cache entry from another recent caller.
  async function fetchSection(sec, { fresh = false } = {}){
    state[sec.id] = { status:'pending', payload:null, fetchedAt:null };
    renderSection(sec);
    try {
      let data, fetchedAt;
      if (sec.via === 'action'){
        const r = await fetchActionResult(sec.service, 45000);
        data = r.data; fetchedAt = r.finishedAt;
      } else {
        const url = '/api/v1/' + sec.service + (fresh ? '?fresh=1' : '');
        const res = await fetch(url, { credentials:'same-origin' });
        const body = await res.json();
        if (!res.ok || body.success === false) throw new Error((body.error && body.error.message) || body.error || ('HTTP ' + res.status));
        data = body.data; fetchedAt = body.generated_at;
      }
      const empty = isMeaningfullyEmpty(data, sec);
      state[sec.id] = { status: empty ? 'empty' : 'ok', payload: data, fetchedAt: fetchedAt || new Date().toISOString() };
    } catch (err) {
      state[sec.id] = { status:'error', payload:null, error: err.message, fetchedAt: new Date().toISOString() };
    }
    renderSection(sec);
    renderNav();
    updateTopStatus();
  }

  // ── Generic real-data renderers — no section invents a chart or a
  // number; every branch below just formats whatever the real payload
  // actually contains. ──
  // A very large real array (e.g. Knowledge Graph's 2785 nodes / 2747
  // edges) previously got JSON.stringify'd and dumped into the DOM in
  // full, freezing the tab for 10-30+ real seconds on every load. Capping
  // at a bounded preview keeps every render fast regardless of how much
  // real data exists behind it -- the full set is always still one real
  // API call away (the card's own "Source:" line), never lost.
  const ARRAY_PREVIEW_CAP = 40;

  function renderValue(v){
    if (v == null) return el('span', { class:'empty' }, ['—']);
    if (Array.isArray(v)){
      if (v.length === 0) return el('span', { class:'empty' }, ['none']);
      if (v.length <= 6 && v.every(x => typeof x !== 'object')) return document.createTextNode(v.join(', '));
      const frag = document.createDocumentFragment();
      const shown = v.length > ARRAY_PREVIEW_CAP ? v.slice(0, ARRAY_PREVIEW_CAP) : v;
      frag.appendChild(el('pre', { class:'raw' }, [JSON.stringify(shown, null, 2)]));
      if (v.length > ARRAY_PREVIEW_CAP){
        frag.appendChild(el('div', { class:'note-line' }, [
          'Showing the first ' + ARRAY_PREVIEW_CAP + ' of ' + v.length + ' real items — not a fabricated summary, just a preview cap.'
        ]));
      }
      return frag;
    }
    if (typeof v === 'object') return el('pre', { class:'raw' }, [JSON.stringify(v, null, 2)]);
    return document.createTextNode(String(v));
  }

  function isComplex(v){
    if (Array.isArray(v)) return v.length > 6 || v.some(x => typeof x === 'object' && x !== null);
    return typeof v === 'object' && v !== null;
  }

  function isScalar(v){
    return v == null || typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean';
  }

  // A 3-segment dotted path (e.g. "health.reality.total_published") reads
  // fine as a hover tooltip but wraps into an ugly 3-line label in the
  // narrow kv-grid column -- shown form keeps only the last 2 segments,
  // full path is still one hover away via the element's title attribute.
  function fullLabelFor(path){
    return path.split('.').map(seg => seg.replace(/_/g,' ')).join(' › ');
  }
  function labelFor(path){
    const segs = path.split('.');
    return (segs.length > 2 ? segs.slice(-2) : segs).map(seg => seg.replace(/_/g,' ')).join(' › ');
  }

  function summaryHint(v){
    if (Array.isArray(v)) return ' (' + v.length + (v.length === 1 ? ' item)' : ' items)');
    if (typeof v === 'object' && v !== null){
      const n = Object.keys(v).length;
      return ' (' + n + (n === 1 ? ' field)' : ' fields)');
    }
    return '';
  }

  // Windows Task Scheduler's real DaysOfWeek trigger property is a bitmask
  // (Sunday=1 ... Saturday=64, per Microsoft's own documented enum) -- a
  // real, standard, publicly-fixed mapping, not an invented one. Decoding
  // it is a pure display transform of the same real field scheduler-
  // status already returns; the raw bitmask integer alone (e.g. "32") is
  // meaningless to a reader and was previously the single most prominent
  // number on the Scheduler card.
  const DAYS_OF_WEEK_BITS = [[1,'Sun'],[2,'Mon'],[4,'Tue'],[8,'Wed'],[16,'Thu'],[32,'Fri'],[64,'Sat']];
  function decodeDaysOfWeekBitmask(n){
    const days = DAYS_OF_WEEK_BITS.filter(([bit]) => (n & bit) === bit).map(([,name]) => name);
    return (days.length ? days.join(', ') : 'none') + ' (bitmask ' + n + ')';
  }

  // Recursively flattens a real payload into ["dotted.path", leafValue]
  // pairs so a nested object reads as clear rows instead of its own raw
  // JSON block. Bounded on DEPTH only (2 levels) -- an earlier breadth-
  // gated version (>6 keys = give up and keep the whole object as one
  // raw block) made real, useful objects like Commercial Intelligence's
  // 15-field "latest" snapshot fully opaque by default even though every
  // one of those 15 fields is a plain scalar. Recursing by depth instead
  // lets each individual scalar surface while only genuinely nested
  // structures (arrays, depth > 2) stay as their own "complex" leaf --
  // handled by renderValue's own array cap above. The out.length safety
  // valve only guards against a pathologically wide real payload; nothing
  // observed in this factory's real services comes close to it. Never
  // renames or invents a value, only relocates it.
  function flattenLeaves(obj, prefix, out, depth){
    Object.entries(obj).forEach(([k, v]) => {
      if (k === 'note' || out.length > 80) return;
      const path = prefix ? prefix + '.' + k : k;
      if (isScalar(v)){
        if (/days_of_week_bitmask$/.test(path) && typeof v === 'number'){
          out.push([path, decodeDaysOfWeekBitmask(v)]);
        } else {
          out.push([path, v]);
        }
      } else if (Array.isArray(v)){
        out.push([path, v]);
      } else if (typeof v === 'object'){
        if (depth < 2){
          flattenLeaves(v, path, out, depth + 1);
        } else {
          out.push([path, v]);
        }
      }
    });
    return out;
  }

  // A right-aligned, single-line kv-grid row reads badly once the real
  // value is a full paragraph (e.g. a Next-Dollar-Actions text blob) --
  // found live once the flattening above started surfacing these strings
  // at all (they were previously buried inside an un-opened raw dump).
  // Long strings get their own left-aligned, readable block instead.
  const LONG_STRING_THRESHOLD = 220;

  function renderKV(payload){
    const leaves = flattenLeaves(payload, '', [], 0);
    const isLongText = (v) => typeof v === 'string' && v.length > LONG_STRING_THRESHOLD;
    const numeric = leaves.filter(([,v]) => typeof v === 'number');
    const longText = leaves.filter(([,v]) => isLongText(v));
    const simple = leaves.filter(([,v]) => typeof v !== 'number' && !isComplex(v) && !isLongText(v));
    const complex = leaves.filter(([,v]) => isComplex(v));
    const frag = document.createDocumentFragment();

    if (numeric.length){
      const row = el('div', { class:'stat-row' });
      numeric.slice(0, 6).forEach(([k,v]) => {
        row.appendChild(el('div', { class:'stat', title: fullLabelFor(k) }, [
          el('div', { class:'num' }, [String(v)]),
          el('div', { class:'label' }, [labelFor(k)]),
        ]));
      });
      frag.appendChild(row);
      if (numeric.length > 6){
        frag.appendChild(el('div', { class:'note-line' }, [(numeric.length - 6) + ' more real numeric field(s) not shown here — see the full source.']));
      }
    }

    if (simple.length){
      const wrap = el('div', { class:'kv-grid' });
      simple.slice(0, 16).forEach(([k,v]) => {
        wrap.appendChild(el('div', { class:'k', title: fullLabelFor(k) }, [labelFor(k)]));
        const isProse = typeof v === 'string' && v.length > 40;
        const vcell = el('div', { class:'v' + (isProse ? ' text' : '') });
        vcell.appendChild(renderValue(v));
        wrap.appendChild(vcell);
      });
      frag.appendChild(wrap);
      if (simple.length > 16){
        frag.appendChild(el('div', { class:'note-line' }, [(simple.length - 16) + ' more real field(s) not shown here — see the full source.']));
      }
    }

    longText.slice(0, 4).forEach(([k, v]) => {
      const block = el('div', { style:'margin-top:.3rem;' });
      block.appendChild(el('div', { class:'card-title', style:'font-size:.74rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; margin-bottom:.3rem;' }, [labelFor(k)]));
      block.appendChild(el('div', { style:'white-space:pre-wrap; line-height:1.55; color:var(--ink-dim);' }, [v]));
      frag.appendChild(block);
    });

    // Genuinely large/deep real structures get their own collapsed
    // <details> block instead of an always-expanded, always-scrolling
    // <pre> -- the previous always-open raw dumps made cards so tall that
    // the mouse wheel got trapped inside their internal scrollbox before
    // ever reaching the rest of the page (confirmed live). Collapsed by
    // default: nothing is hidden permanently, a reader who wants the full
    // real detail clicks to open it.
    complex.slice(0, 8).forEach(([k, v]) => {
      const details = el('details', { style:'margin-top:.3rem;' });
      details.appendChild(el('summary', {
        style:'cursor:pointer; font-size:.74rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; padding:.2rem 0;'
      }, [labelFor(k) + summaryHint(v)]));
      details.appendChild(renderValue(v));
      frag.appendChild(details);
    });

    if (payload.note) frag.appendChild(el('div', { class:'note-line' }, [payload.note]));
    return frag;
  }

  function renderList(payload, listKey){
    const items = listKey ? payload[listKey] : payload;
    if (!Array.isArray(items) || items.length === 0){
      return el('div', { class:'empty' }, ['No verified data']);
    }
    const ul = el('ul', { class:'card-list' });
    items.slice(0, 25).forEach(item => {
      const label = item.niche || item.title || item.filename || item.name || JSON.stringify(item).slice(0, 80);
      const sub = [item.status, item.date, item.ladder_score != null ? ('score ' + item.ladder_score) : null, item.opportunity_score != null ? ('score ' + item.opportunity_score) : null].filter(Boolean).join(' · ');
      ul.appendChild(el('li', null, [
        el('div', null, [String(label)]),
        sub ? el('div', { class:'note-line' }, [sub]) : null,
      ]));
    });
    return ul;
  }

  function renderLogs(payload){
    const frag = document.createDocumentFragment();
    Object.entries(payload).forEach(([file, info]) => {
      const box = el('div', { style:'margin-bottom:.7rem;' });
      box.appendChild(el('div', { class:'card-title', style:'font-size:.78rem; margin-bottom:.3rem;' }, [
        file + (info.exists ? ' (' + info.total_lines + ' lines)' : ' — not written yet')
      ]));
      if (info.exists && info.last_lines && info.last_lines.length){
        box.appendChild(el('pre', { class:'raw' }, [info.last_lines.slice(-8).join('\n')]));
      }
      frag.appendChild(box);
    });
    return frag;
  }

  function pillFor(status){
    if (status === 'pending') return { cls:'pending', label:'Loading' };
    if (status === 'error') return { cls:'bad', label:'Unavailable' };
    if (status === 'empty') return { cls:'warn', label:'No verified data' };
    return { cls:'ok', label:'Live' };
  }

  function renderSection(sec){
    let container = document.getElementById('sec-' + sec.id);
    const s = state[sec.id] || { status:'pending' };
    const pill = pillFor(s.status);

    if (!container){
      const section = el('section', { class:'section', id:'sec-' + sec.id });
      section.appendChild(el('div', { class:'section-head' }, [
        el('h2', null, [sec.title]),
        sec.note ? el('span', { class:'section-note' }, [sec.note]) : null,
      ]));
      const grid = el('div', { class:'card-grid', id:'grid-' + sec.id });
      section.appendChild(grid);
      document.getElementById('sections').appendChild(section);
      container = grid;
    }
    container.innerHTML = '';

    const card = el('div', { class:'card' });
    card.appendChild(el('div', { class:'card-top' }, [
      el('div', { class:'card-title' }, [sec.title]),
      el('span', { class:'pill ' + pill.cls }, [pill.label]),
    ]));
    card.appendChild(el('div', { class:'card-meta' }, [
      el('span', null, [el('b', null, ['Source: ']), sec.via === 'action' ? ('/api/v1/actions/' + sec.service + ' (async report)') : ('/api/v1/' + sec.service)]),
      el('span', null, [el('b', null, ['Updated: ']), relTime(s.fetchedAt)]),
      el('span', null, [el('b', null, ['Confidence: ']), s.status === 'pending' ? '—' : confidenceFor(s.payload, sec)]),
    ]));

    const body = el('div', { class:'card-body' });
    if (s.status === 'pending'){
      body.appendChild(el('div', { class:'empty' }, ['Loading real data…']));
    } else if (s.status === 'error'){
      body.appendChild(el('div', { class:'empty' }, ['No verified data — ' + (s.error || 'request failed')]));
    } else if (s.status === 'empty'){
      body.appendChild(el('div', { class:'empty' }, ['No verified data']));
    } else if (sec.kind === 'logs'){
      body.appendChild(renderLogs(s.payload));
    } else if (sec.kind === 'list'){
      body.appendChild(renderList(s.payload, sec.listKey));
    } else {
      body.appendChild(renderKV(s.payload));
    }
    card.appendChild(body);
    container.appendChild(card);
  }

  function renderNav(){
    const nav = document.getElementById('sectionNav');
    nav.innerHTML = '';
    SECTIONS.forEach(sec => {
      const s = state[sec.id] || { status:'pending' };
      const dotCls = s.status === 'ok' ? 'ok' : s.status === 'empty' ? 'warn' : s.status === 'error' ? 'bad' : 'pending';
      const a = el('a', { href:'#sec-' + sec.id }, [
        el('span', null, [sec.title]),
        el('span', { class:'navdot ' + dotCls }),
      ]);
      nav.appendChild(a);
    });
  }

  function updateTopStatus(){
    const values = Object.values(state);
    const loaded = values.filter(s => s.status !== 'pending').length;
    const ok = values.filter(s => s.status === 'ok').length;
    const errored = values.filter(s => s.status === 'error').length;
    const textEl = document.getElementById('topStatusText');
    const lineEl = document.getElementById('lastRefreshLine');
    if (loaded < SECTIONS.length){
      textEl.textContent = 'Loading real data… (' + loaded + '/' + SECTIONS.length + ')';
    } else {
      textEl.textContent = ok + '/' + SECTIONS.length + ' sections live' + (errored ? ', ' + errored + ' unavailable' : '');
      lineEl.textContent = 'Last refreshed ' + new Date().toLocaleString() + ' · auto-refreshes every 60s';
    }
  }

  async function loadAll({ fresh = false } = {}){
    SECTIONS.forEach(renderSection);
    renderNav();
    await Promise.all(SECTIONS.map(sec => fetchSection(sec, { fresh })));
  }

  // ── Global search: filters already-rendered real cards by their own
  // real text content — never a server round-trip, never invents a
  // result that wasn't already loaded. ──
  document.getElementById('globalSearch').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(card => {
      const hit = !q || card.textContent.toLowerCase().includes(q);
      card.classList.toggle('filtered-out', !hit);
    });
    document.querySelectorAll('.section').forEach(sec => {
      const anyVisible = [...sec.querySelectorAll('.card')].some(c => !c.classList.contains('filtered-out'));
      sec.style.display = anyVisible ? '' : 'none';
    });
  });

  // The Refresh button always forces a genuinely fresh real read
  // (?fresh=1, bypassing server.js's own 20s service cache) -- a click
  // labelled "Refresh" must never quietly hand back a stale cached value.
  document.getElementById('refreshBtn').addEventListener('click', () => loadAll({ fresh: true }));

  // Automatic refresh (Galaxy Forge v1.0 "World-Class Quality" directive,
  // Production Readiness bucket) -- the same real setInterval pattern
  // dashboard.html already uses (60s), extended to this page, which
  // previously had none. Deliberately does NOT force-bypass the cache --
  // an unattended tick reusing a cache entry another real caller just
  // populated is exactly the redundant-spawn cost that cache exists to
  // remove. Skips the tick entirely while the tab is backgrounded, so an
  // idle browser tab never pays real Python-subprocess cost for a screen
  // nobody is looking at.
  const AUTO_REFRESH_MS = 60000;
  setInterval(() => { if (!document.hidden) loadAll(); }, AUTO_REFRESH_MS);

  // ── Export: a real, timestamped JSON snapshot of exactly what's
  // currently loaded on screen — no server round-trip, no reformatting. ──
  document.getElementById('exportBtn').addEventListener('click', () => {
    const snapshot = {};
    SECTIONS.forEach(sec => { snapshot[sec.id] = state[sec.id]; });
    const blob = new Blob([JSON.stringify({ exported_at: new Date().toISOString(), sections: snapshot }, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'galaxy-forge-mission-control-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.json';
    a.click();
  });

  // ── Executive PDF report: reuses the real export-executive-report
  // action (validation_layer/daily_report.py + revenue_pipeline/
  // pipeline.py) rather than inventing a second report generator, then
  // opens the browser's own print dialog (Save as PDF) — no new PDF
  // library dependency. ──
  document.getElementById('pdfBtn').addEventListener('click', async () => {
    const btn = document.getElementById('pdfBtn');
    btn.disabled = true; btn.textContent = 'Generating…';
    try {
      const res = await fetch('/api/v1/actions/export-executive-report', {
        method:'POST', credentials:'same-origin',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ confirmed:true }),
      });
      const body = await res.json();
      if (!res.ok || body.success === false){
        alert('Report generation failed: ' + ((body.error && body.error.message) || body.error || 'unknown error'));
        return;
      }
      const job = body.job || {};
      const result = job.result || {};
      const win = window.open('', '_blank');
      win.document.write(
        '<title>Galaxy Forge — Executive Report</title>' +
        '<pre style="font-family:IBM Plex Mono,monospace; white-space:pre-wrap; padding:2rem; max-width:800px; margin:0 auto;">' +
        (result.markdown || result.report || JSON.stringify(result, null, 2)).replace(/</g,'&lt;') +
        '</pre>'
      );
      win.document.close();
      win.focus();
      setTimeout(() => win.print(), 400);
    } catch (err) {
      alert('Report generation failed: ' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = '📄 Executive PDF Report';
    }
  });

  document.getElementById('menuToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });

  window.addEventListener('scroll', () => {
    let current = null;
    document.querySelectorAll('.section').forEach(sec => {
      if (sec.getBoundingClientRect().top < 140) current = sec.id;
    });
    document.querySelectorAll('#sectionNav a').forEach(a => {
      a.classList.toggle('active', current && a.getAttribute('href') === '#' + current);
    });
  }, { passive:true });

  loadAll();
})();
</script>
</body>
</html>
