name: CI

# Phase 10C (Operations Automation & CI/CD Pipeline). Real CI — runs the
# actual test suite on GitHub's own runners. This does not touch the
# factory's live business infrastructure (no Groq calls, no n8n, no
# publishing) and is not the "no scheduler" this factory's architecture
# deliberately avoids for its own runtime — it only validates code
# changes before they merge, the same as any standard software project.
#
# No merge to main should occur unless every job below passes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      # ── Architecture integrity ──
      - name: Syntax check server.js
        run: node -c server.js

      - name: Syntax check every Python module (compileall)
        run: python -m compileall -q . -x '(venv|__pycache__)'

      - name: Syntax check Mission Control's inline JavaScript
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('mission_control.html', 'utf8');
          const m = html.match(/<script>([\s\S]*)<\/script>/);
          if (!m) { console.error('no <script> block found'); process.exit(1); }
          new Function(m[1]);
          console.log('mission_control.html inline JS: syntax OK');
          "

      # ── Engineering Evolution Mode: no new JSONL-read duplication ──
      # Level 2 permanent safeguard (see scripts/check_jsonl_duplication.js's
      # own header): the same manual "read file, split lines, skip a
      # corrupt one" idiom was independently reimplemented 17+ times
      # before lib/jsonl.js existed. This fails the build the moment a
      # new copy is introduced anywhere, instead of letting the count
      # silently grow until a future audit notices again.
      - name: No new JSONL-read duplication beyond the recorded baseline
        run: node scripts/check_jsonl_duplication.js

      # ── Security check: secrets never committed ──
      - name: Verify .env is never tracked in git
        run: |
          if git ls-files | grep -qx '\.env'; then
            echo "::error::.env is tracked in git — secrets must only live in .env, never committed"
            exit 1
          fi
          echo "confirmed: .env is not tracked"

      # ── Python tests ──
      - name: Python tests (a)
        run: python -m unittest discover -s tests -p "test_a*.py"

      - name: Python tests (b: base_arm)
        run: python -m unittest discover -s tests -p "test_base_arm.py"

      - name: Python tests (b: book_generator_dispatch)
        run: python -m unittest discover -s tests -p "test_book_generator_dispatch.py"

      - name: Python tests (b: book_generator_legacy_dual_inspection)
        run: python -m unittest discover -s tests -p "test_book_generator_legacy_dual_inspection.py"

      - name: Python tests (b: book_generator_output_path_safety)
        run: python -m unittest discover -s tests -p "test_book_generator_output_path_safety.py"

      - name: Python tests (b: brand_dna)
        run: python -m unittest discover -s tests -p "test_brand_dna.py"

      - name: Python tests (b: build_in_public)
        run: python -m unittest discover -s tests -p "test_build_in_public.py"

      - name: Python tests (b: business_development)
        run: python -m unittest discover -s tests -p "test_business_development.py"

      - name: Python tests (b: business_dossier)
        run: python -m unittest discover -s tests -p "test_business_dossier.py"

      - name: Python tests (b: butter_price_tiers)
        run: python -m unittest discover -s tests -p "test_butter_price_tiers.py"


      - name: Python tests (c-d)
        run: python -m unittest discover -s tests -p "test_[c-d]*.py"

      - name: Python tests (e)
        run: python -m unittest discover -s tests -p "test_e*.py"

      - name: Python tests (f)
        run: python -m unittest discover -s tests -p "test_f*.py"

      - name: Python tests (g-h)
        run: python -m unittest discover -s tests -p "test_[g-h]*.py"

      - name: Python test files are all covered by exactly one group
        run: |
          python - <<'PY'
          import glob, os, sys
          groups = ["test_a*.py", "test_[c-d]*.py", "test_e*.py",
                    "test_f*.py", "test_[g-h]*.py"] + ['test_base_arm.py', 'test_book_generator_dispatch.py', 'test_book_generator_legacy_dual_inspection.py', 'test_book_generator_output_path_safety.py', 'test_brand_dna.py', 'test_build_in_public.py', 'test_business_development.py', 'test_business_dossier.py', 'test_butter_price_tiers.py']
          allf = {os.path.basename(p) for p in glob.glob("tests/test_*.py")}
          seen = {}
          for g in groups:
              for f in glob.glob(os.path.join("tests", g)):
                  seen.setdefault(os.path.basename(f), []).append(g)
          missing = sorted(allf - set(seen))
          dupes = sorted(f for f, gs in seen.items() if len(gs) > 1)
          print("test files: %d" % len(allf))
          if missing:
              print("::error::not run by any group: %s" % ", ".join(missing))
          if dupes:
              print("::error::run by more than one group: %s" % ", ".join(dupes))
          if missing or dupes:
              sys.exit(1)
          print("every test file is covered by exactly one group")
          PY

      - name: JavaScript unit tests (metrics, dashboard data, n8n notify)
        run: node --test tests/test_metrics.js tests/test_dashboard_data.js tests/test_n8n_notify.js

      # CTO+COO audit closure (2026-08-15): previously only 5 of 53 JS test
      # files ran in CI, silently excluding every security-critical suite
      # (test_login_security, test_customer_auth, test_server_crash_handlers,
      # test_supervisor, test_telegram_direct, test_restore_file_from_git, …).
      # All remaining files verified to run standalone via node --test. The
      # slow server-spawning suites (factory_loop_golden, api_contract) stay
      # as their own steps below to keep the fast pure-unit set from blocking
      # on a full server boot.
      - name: JavaScript tests (all remaining test_*.js, incl. security suites)
        run: node --test tests/test_brand_dna_preamble_consistency.js tests/test_check_jsonl_duplication.js tests/test_customer_auth.js tests/test_customer_front_door.js tests/test_department_events.js tests/test_deploy_production.js tests/test_factory_loop_business_blueprint_generation.js tests/test_factory_loop_commission_opportunity_scan.js tests/test_factory_loop_daily_ai_doctor_report.js tests/test_factory_loop_daily_commercial_readiness_snapshot.js tests/test_factory_loop_daily_department_health_report.js tests/test_factory_loop_daily_evolution_queue_intake.js tests/test_factory_loop_daily_evolution_report.js tests/test_factory_loop_daily_executive_brief.js tests/test_factory_loop_daily_growth_stage_snapshot.js tests/test_factory_loop_daily_knowledge_graph.js tests/test_factory_loop_evidence_recording_audit.js tests/test_factory_loop_lock.js tests/test_factory_loop_monthly_galaxy_evolution_report.js tests/test_factory_loop_notification.js tests/test_factory_loop_payment_status_check_tick.js tests/test_factory_loop_pricing_review.js tests/test_factory_loop_quarterly_annual_reviews.js tests/test_factory_loop_resilience_monitor_tick.js tests/test_factory_loop_tick_overlap.js tests/test_factory_loop_weekly_executive_report.js tests/test_factory_state.js tests/test_harden_file_acls.js tests/test_health_checks.js tests/test_health_monitor.js tests/test_health_trend.js tests/test_index_html_xss_fix.js tests/test_infrastructure_intelligence.js tests/test_jsonl.js tests/test_login_security.js tests/test_market_validation.js tests/test_next_sale_id.js tests/test_ops_maintenance.js tests/test_pending_review.js tests/test_process_pending_retries.js tests/test_publisher_seo.js tests/test_recovery_log.js tests/test_restore_file_from_git.js tests/test_self_awareness_precomputed_health.js tests/test_server_crash_handlers.js tests/test_supervisor.js tests/test_telegram_direct.js tests/test_trust_center.js tests/test_factory_loop_arm_status_watch.js tests/test_factory_loop_autonomous_loop_closures.js tests/test_factory_loop_freelancer_grant_resume.js tests/test_factory_loop_freelancer_state_monitor.js tests/test_factory_loop_internal_token.js tests/test_factory_loop_lock_identity.js tests/test_factory_loop_reality_integrity_check.js tests/test_factory_loop_seo_distribution.js tests/test_factory_loop_x_queued_post.js tests/test_job_queue.js tests/test_security_p1.js tests/test_telegram_commands.js tests/test_attribution_log_bounds.js

      # ── Factory Loop tests ──
      - name: Factory Loop tests
        run: node tests/test_factory_loop_golden.js

      # ── API contract tests ──
      - name: API contract tests
        run: node --test tests/test_api_contract.js
        env:
          MISSION_CONTROL_PASSWORD: ci-contract-test-password

      # ── Lightweight performance regression gate ──
      - name: Performance smoke check (generous thresholds, not a full load test)
        run: |
          MISSION_CONTROL_PASSWORD=ci-perf-check-password PORT=3299 node server.js &
          SERVER_PID=$!
          sleep 3
          node scripts/perf_measure.js http://localhost:3299 ci-perf-check-password latency > /tmp/ci_perf_output.txt || true
          cat /tmp/ci_perf_output.txt
          kill $SERVER_PID
          # Fail only on a gross regression (e.g. an endpoint hanging/erroring
          # for minutes) — this is a smoke check, not a strict performance
          # gate; CI runner performance varies and isn't comparable to any
          # specific real-hardware baseline.
          if grep -qi "error\|nan" /tmp/ci_perf_output.txt; then
            echo "::error::performance smoke check reported an error or non-numeric latency"
            exit 1
          fi
